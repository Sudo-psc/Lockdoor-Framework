{% extends "base.html" %}

{% block content %}
<h2>Available Plugins</h2>
<br>
{% if plugins %}
    <ul class="list-group">
        {% for plugin in plugins %}
            <li class="list-group-item">
                <h5>{{ plugin.get_name() }}</h5>
                <p>{{ plugin.get_description() }}</p>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="alert alert-info" role="alert">
        No plugins found or loaded.
    </div>
{% endif %}
{% endblock %}
